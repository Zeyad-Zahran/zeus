<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with Supabase</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; }
    #chat p { margin: 5px 0; }
    #inputForm { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Chat Demo</h1>
  <div id="chat"></div>

  <form id="inputForm">
    <input type="text" id="messageInput" placeholder="Type your message..." required>
    <button type="submit">Send</button>
  </form>

  <script>
    const API_URL = "https://proxy-api-sard-dev.vercel.app/api/functions/v1/chat";
    const API_TOKEN = "2b8d4611eb8d2d228f2baa3b2b7c99a4f548f0e582b806321ec2e1f7547efd09";

    const chatDiv = document.getElementById("chat");
    const form = document.getElementById("inputForm");
    const input = document.getElementById("messageInput");

    async function chat(messages) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-token": API_TOKEN
        },
        body: JSON.stringify({ messages, stream: true })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const text = decoder.decode(value);
        const p = document.createElement("p");
        p.textContent = text;
        chatDiv.appendChild(p);
        chatDiv.scrollTop = chatDiv.scrollHeight;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const userMessage = input.value.trim();
      if (!userMessage) return;

      const p = document.createElement("p");
      p.textContent = "You: " + userMessage;
      chatDiv.appendChild(p);

      input.value = "";
      await chat([{ role: "user", content: userMessage }]);
    });
  </script>
</body>
</html>
